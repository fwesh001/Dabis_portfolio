        <!-- Article Body Prose -->
        <div class="space-y-6 text-sm text-zinc-300 leading-relaxed font-sans">
          <p>
            In high-throughput transactional backends, duplicate requests are inevitable. Unreliable client mobile connections, automatic reverse-proxy retries, and network partition timeouts frequently cause the exact same mutation request to hit an API gateway multiple times in milliseconds.
          </p>

          <!-- Section 1 -->
          <h2 id="section-problem" class="text-xl sm:text-2xl font-bold font-mono tracking-tight text-white pt-4 flex items-center gap-2">
            <span class="text-[var(--accent)]">01 //</span> The Duplicate Mutation Dilemma
          </h2>
          <p>
            Without strict idempotency guarantees, submitting an order or initiating a payment twice results in double billing. While standard database unique constraints work for simple records, complex workflows involving external third-party payment gateways (Stripe, Adyen) cannot be rolled back with a simple database rollback.
          </p>

          <!-- Callout Alert -->
          <div class="p-4 rounded-xl bg-zinc-900/80 border-l-4 border-[var(--accent)] space-y-1 text-xs">
            <div class="font-bold text-white font-mono flex items-center gap-1.5">
              <i data-lucide="alert-circle" class="w-3.5 h-3.5 text-[var(--accent)]"></i> Core Requirement
            </div>
            <p class="text-zinc-400">
              An idempotency key must be atomic: if two concurrent threads submit key <code>idemp_48f9a2</code>, exactly one must proceed to execute the business logic, while the concurrent duplicate waits or returns the cached response.
            </p>
          </div>

          <!-- Section 2 -->
          <h2 id="section-architecture" class="text-xl sm:text-2xl font-bold font-mono tracking-tight text-white pt-4 flex items-center gap-2">
            <span class="text-[var(--accent)]">02 //</span> Two-Tier Lease Architecture
          </h2>
          <p>
            To achieve high performance without overloading the primary relational database, we pair an in-memory <strong>Redis distributed lock lease</strong> with a durable <strong>PostgreSQL write-ahead idempotency ledger</strong>.
          </p>

          <!-- Visual Architecture Block -->
          <div class="p-4 rounded-xl bg-zinc-900 border border-zinc-800 font-mono text-xs text-zinc-300 space-y-1.5 overflow-x-auto">
            <div class="text-[var(--accent)] font-bold">1. Client Request &rarr; Header: Idempotency-Key: uuid-4</div>
            <div class="pl-4 text-zinc-400">2. Redis SETNX `idemp:{key}` with 30s TTL</div>
            <div class="pl-8 text-emerald-400">&bull; If Locked &rarr; Poll for result or return 409 Conflict</div>
            <div class="pl-8 text-white">&bull; If Acquired &rarr; Begin PostgreSQL Transaction</div>
            <div class="pl-4 text-zinc-400">3. Execute Business Logic &rarr; Write Result to DB</div>
            <div class="text-[var(--accent)] font-bold">4. Release Redis Lock &amp; Cache Final Response in Redis for 24h</div>
          </div>

          <!-- Section 4 -->
          <h2 id="section-tradeoffs" class="text-xl sm:text-2xl font-bold font-mono tracking-tight text-white pt-4 flex items-center gap-2">
            <span class="text-[var(--accent)]">04 //</span> Failure Modes &amp; Recovery
          </h2>
          <p>
            What happens if the backend worker node crashes mid-transaction after claiming the Redis lease?
          </p>
          <ul class="list-disc pl-5 space-y-2 text-zinc-400 text-xs sm:text-sm">
            <li><strong>Lease Expiration:</strong> The 30-second TTL on Redis ensures that dead worker locks automatically expire, allowing subsequent retries to succeed.</li>
            <li><strong>PostgreSQL WAL Verification:</strong> If the database committed before the worker crashed, the recovery worker detects the existing committed row in PostgreSQL and immediately updates Redis with the completed status.</li>
          </ul>

  <script>
    lucide.createIcons();

    // View Switcher between Blog Index and Article Reader
    function switchBlogView(view) {
      const indexView = document.getElementById('view-index');
      const readerView = document.getElementById('view-reader');
      const tabIndex = document.getElementById('tab-index');
      const tabReader = document.getElementById('tab-reader');

      if (view === 'reader') {
        indexView.classList.add('hidden');
        readerView.classList.remove('hidden');
        tabReader.className = 'px-3 py-1.5 rounded-lg font-medium transition-colors bg-zinc-800 text-white shadow-sm flex items-center gap-1.5';
        tabIndex.className = 'px-3 py-1.5 rounded-lg font-medium transition-colors text-zinc-400 hover:text-white flex items-center gap-1.5';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        readerView.classList.add('hidden');
        indexView.classList.remove('hidden');
        tabIndex.className = 'px-3 py-1.5 rounded-lg font-medium transition-colors bg-zinc-800 text-white shadow-sm flex items-center gap-1.5';
        tabReader.className = 'px-3 py-1.5 rounded-lg font-medium transition-colors text-zinc-400 hover:text-white flex items-center gap-1.5';
      }
    }

    // Scroll reading progress calculation
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      const bar = document.getElementById('reading-progress-bar');
      if (bar) bar.style.width = `${scrolled}%`;

      // Update active TOC item
      const sections = document.querySelectorAll('h2[id]');
      let currentId = '';
      sections.forEach(sec => {
        const top = sec.getBoundingClientRect().top;
        if (top <= 120) currentId = sec.getAttribute('id');
      });

      document.querySelectorAll('.toc-link').forEach(link => {
        if (link.getAttribute('href') === `#${currentId}`) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    });

    // Copy Code Snippet
    function copyCodeSnippet(elementId, btn) {
      const code = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-emerald-400"></i><span class="text-emerald-400">Copied!</span>`;
        lucide.createIcons({ root: btn });
        setTimeout(() => {
          btn.innerHTML = originalText;
          lucide.createIcons({ root: btn });
        }, 2000);
      });
    }

    // Mobile TOC toggle
    function toggleMobileToc() {
      const content = document.getElementById('mobile-toc-content');
      const icon = document.getElementById('mobile-toc-icon');
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
      } else {
        content.classList.add('hidden');
        icon.style.transform = 'rotate(0deg)';
      }
    }

    // Filter Posts by Tag
    function filterBlogByTag(tag) {
      document.querySelectorAll('.blog-tag-btn').forEach(btn => {
        if (btn.getAttribute('data-tag') === tag) {
          btn.className = 'blog-tag-btn px-3 py-1 rounded-lg bg-zinc-800 text-white border border-zinc-700';
        } else {
          btn.className = 'blog-tag-btn px-3 py-1 rounded-lg bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800/60';
        }
      });

      document.querySelectorAll('#posts-container .post-item').forEach(post => {
        const tags = post.getAttribute('data-tags');
        if (tag === 'all' || tags.includes(tag)) {
          post.style.display = 'block';
        } else {
          post.style.display = 'none';
        }
      });
    }

    // Search query filter
    function filterBlogPosts(query) {
      const q = query.toLowerCase();
      document.querySelectorAll('#posts-container .post-item').forEach(post => {
        const text = post.textContent.toLowerCase();
        post.style.display = text.includes(q) ? 'block' : 'none';
      });
    }
  <\/script>

  <script>
    lucide.createIcons();

    let currentMode = 'desktop';
    let currentTheme = 'dark';
    let currentAccent = '#10B981';

    const iframe = document.getElementById('preview-iframe');
    const container = document.getElementById('frame-container');
    const notch = document.getElementById('mobile-notch');
    const desktopChrome = document.getElementById('desktop-chrome');
    const viewportIndicator = document.getElementById('viewport-indicator');

    function loadIframeContent() {
      const template = document.getElementById('inner-html-template').innerHTML;
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(template);
      doc.close();

      setTimeout(() => {
        applyThemeToIframe();
        applyAccentToIframe();
      }, 50);
    }

    function setViewportMode(mode) {
      currentMode = mode;
      
      document.getElementById('btn-desktop').className = mode === 'desktop' 
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';
      
      document.getElementById('btn-mobile').className = mode === 'mobile'
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';

      document.getElementById('btn-fluid').className = mode === 'fluid'
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';

      if (mode === 'desktop') {
        container.style.width = '1440px';
        container.style.maxWidth = '100%';
        container.style.height = '100%';
        container.classList.remove('phone-bezel');
        container.classList.add('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.remove('hidden');
        notch.classList.add('hidden');
        viewportIndicator.textContent = '1440 x 900';
      } else if (mode === 'mobile') {
        container.style.width = '390px';
        container.style.maxWidth = '390px';
        container.style.height = '844px';
        container.classList.add('phone-bezel');
        container.classList.remove('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.add('hidden');
        notch.classList.remove('hidden');
        viewportIndicator.textContent = '390 x 844 (iPhone)';
      } else if (mode === 'fluid') {
        container.style.width = '100%';
        container.style.maxWidth = '100%';
        container.style.height = '100%';
        container.classList.remove('phone-bezel');
        container.classList.add('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.remove('hidden');
        notch.classList.add('hidden');
        viewportIndicator.textContent = `${window.innerWidth} x ${window.innerHeight}`;
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      const root = document.documentElement;
      const themeText = document.getElementById('theme-text');
      const themeIcon = document.getElementById('theme-icon');

      if (currentTheme === 'light') {
        root.classList.remove('dark');
        themeText.textContent = 'Light';
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        root.classList.add('dark');
        themeText.textContent = 'Dark';
        themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
      applyThemeToIframe();
    }

    function applyThemeToIframe() {
      try {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        if (currentTheme === 'light') {
          idoc.documentElement.classList.remove('dark');
          idoc.documentElement.classList.add('light');
        } else {
          idoc.documentElement.classList.add('dark');
          idoc.documentElement.classList.remove('light');
        }
      } catch (e) {
        console.error(e);
      }
    }

    function setAccent(color) {
      currentAccent = color;
      document.documentElement.style.setProperty('--accent', color);
      
      document.querySelectorAll('.accent-swatch').forEach(btn => {
        if (btn.getAttribute('data-color') === color) {
          btn.classList.add('ring-white');
        } else {
          btn.classList.remove('ring-white');
        }
      });
      applyAccentToIframe();
    }

    function applyAccentToIframe() {
      try {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        idoc.documentElement.style.setProperty('--accent', currentAccent);
        idoc.documentElement.style.setProperty('--accent-muted', `${currentAccent}26`);
      } catch (e) {
        console.error(e);
      }
    }

    loadIframeContent();
    setViewportMode('desktop');
    setAccent('#10B981');
  </script>
