  <style>
    :root {
      --accent: #10B981;
      --accent-muted: rgba(16, 185, 129, 0.15);
    }
    html.dark {
      background-color: #09090b;
      color: #fafafa;
    }
    html:not(.dark) {
      background-color: #fafafa;
      color: #09090b;
    }
    /* Custom Cursor */
    .cursor-dot {
      pointer-events: none;
      position: fixed;
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: opacity 0.15s ease;
    }
    .cursor-ring {
      pointer-events: none;
      position: fixed;
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), height 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease, border-color 0.2s ease;
    }
    .cursor-hover .cursor-ring {
      width: 44px;
      height: 44px;
      background-color: var(--accent-muted);
      border-color: var(--accent);
    }
    @media (pointer: coarse) {
      .cursor-dot, .cursor-ring { display: none !important; }
    }
  </style>
</head>

  <!-- Scripts for inner page -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Custom Spring Cursor tracking
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mouseX = -100, mouseY = -100;
    let ringX = -100, ringY = -100;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.left = `${mouseX}px`;
      dot.style.top = `${mouseY}px`;
    });

    function animateCursor() {
      ringX += (mouseX - ringX) * 0.18;
      ringY += (mouseY - ringY) * 0.18;
      ring.style.left = `${ringX}px`;
      ring.style.top = `${ringY}px`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Hover effect for interactive items
    document.querySelectorAll('a, button, input, select, .cursor-pointer').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });

    // Custom Right Click Context Menu
    const contextMenu = document.getElementById('custom-context-menu');
    window.addEventListener('contextmenu', (e) => {
      if (e.shiftKey) return; // Escape hatch
      e.preventDefault();
      contextMenu.style.left = `${Math.min(e.clientX, window.innerWidth - 220)}px`;
      contextMenu.style.top = `${Math.min(e.clientY, window.innerHeight - 200)}px`;
      contextMenu.classList.remove('hidden');
    });

    window.addEventListener('click', () => hideContextMenu());
    function hideContextMenu() {
      contextMenu.classList.add('hidden');
    }

    // Command Palette Modal
    const cmdPalette = document.getElementById('cmd-palette-backdrop');
    const cmdInput = document.getElementById('cmd-input');

    function toggleCommandPalette(open) {
      if (open) {
        cmdPalette.classList.remove('hidden');
        cmdInput.value = '';
        setTimeout(() => cmdInput.focus(), 50);
      } else {
        cmdPalette.classList.add('hidden');
      }
    }

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        toggleCommandPalette(cmdPalette.classList.contains('hidden'));
      }
      if (e.key === 'Escape') {
        toggleCommandPalette(false);
        hideContextMenu();
      }
    });

    cmdPalette.addEventListener('click', (e) => {
      if (e.target === cmdPalette) toggleCommandPalette(false);
    });

    function cmdNavigate(hash) {
      toggleCommandPalette(false);
      window.location.hash = hash;
    }

    function filterCommandPalette(query) {
      const q = query.toLowerCase();
      document.querySelectorAll('#cmd-list .cmd-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    // Demo availability toggle
    let isAvailable = true;
    function toggleDemoSwitch() {
      isAvailable = !isAvailable;
      const knob = document.getElementById('demo-toggle-knob');
      const btn = document.getElementById('demo-toggle');
      const label = document.getElementById('demo-toggle-label');
      if (isAvailable) {
        knob.style.transform = 'translateX(20px)';
        btn.style.backgroundColor = 'var(--accent)';
        label.textContent = 'Open to Roles';
      } else {
        knob.style.transform = 'translateX(0px)';
        btn.style.backgroundColor = '#3f3f46';
        label.textContent = 'Currently Busy';
      }
    }

    // Toast function
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-700/80 shadow-2xl text-xs text-zinc-100 font-sans transition-all duration-300 transform translate-y-4 opacity-0';
      
      let icon = 'check-circle-2';
      let iconColor = 'text-[var(--accent)]';
      if (type === 'info') { icon = 'info'; iconColor = 'text-blue-400'; }
      if (type === 'warning') { icon = 'alert-triangle'; iconColor = 'text-amber-400'; }

      toast.innerHTML = `
        <i data-lucide="${icon}" class="w-4 h-4 ${iconColor} flex-shrink-0"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons({ root: toast });

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }
  <\/script>
</body>
</html>
  </script>

  <script>
    lucide.createIcons();

    let currentMode = 'desktop';
    let currentTheme = 'dark';
    let currentAccent = '#10B981';

    const iframe = document.getElementById('preview-iframe');
    const container = document.getElementById('frame-container');
    const notch = document.getElementById('mobile-notch');
    const desktopChrome = document.getElementById('desktop-chrome');
    const viewportIndicator = document.getElementById('viewport-indicator');

    // Load template HTML into the iframe
    function loadIframeContent() {
      const template = document.getElementById('inner-html-template').innerHTML;
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(template);
      doc.close();

      // Apply initial theme & accent to iframe
      setTimeout(() => {
        applyThemeToIframe();
        applyAccentToIframe();
      }, 50);
    }

    // Viewport Mode Switcher
    function setViewportMode(mode) {
      currentMode = mode;
      
      // Update button styling
      document.getElementById('btn-desktop').className = mode === 'desktop' 
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';
      
      document.getElementById('btn-mobile').className = mode === 'mobile'
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';

      document.getElementById('btn-fluid').className = mode === 'fluid'
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';

      if (mode === 'desktop') {
        container.style.width = '1440px';
        container.style.maxWidth = '100%';
        container.style.height = '100%';
        container.classList.remove('phone-bezel');
        container.classList.add('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.remove('hidden');
        notch.classList.add('hidden');
        viewportIndicator.textContent = '1440 x 900';
      } else if (mode === 'mobile') {
        // Strict 390px iPhone viewport inside real iframe
        container.style.width = '390px';
        container.style.maxWidth = '390px';
        container.style.height = '844px';
        container.classList.add('phone-bezel');
        container.classList.remove('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.add('hidden');
        notch.classList.remove('hidden');
        viewportIndicator.textContent = '390 x 844 (iPhone)';
      } else if (mode === 'fluid') {
        container.style.width = '100%';
        container.style.maxWidth = '100%';
        container.style.height = '100%';
        container.classList.remove('phone-bezel');
        container.classList.add('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.remove('hidden');
        notch.classList.add('hidden');
        viewportIndicator.textContent = `${window.innerWidth} x ${window.innerHeight}`;
      }
    }

    // Theme Switcher
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      const root = document.documentElement;
      const themeText = document.getElementById('theme-text');
      const themeIcon = document.getElementById('theme-icon');

      if (currentTheme === 'light') {
        root.classList.remove('dark');
        themeText.textContent = 'Light';
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        root.classList.add('dark');
        themeText.textContent = 'Dark';
        themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
      applyThemeToIframe();
    }

    function applyThemeToIframe() {
      try {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        if (currentTheme === 'light') {
          idoc.documentElement.classList.remove('dark');
          idoc.documentElement.classList.add('light');
        } else {
          idoc.documentElement.classList.add('dark');
          idoc.documentElement.classList.remove('light');
        }
      } catch (e) {
        console.error(e);
      }
    }

    // Accent Color Switcher
    function setAccent(color) {
      currentAccent = color;
      document.documentElement.style.setProperty('--accent', color);
      
      // Update swatch active outline
      document.querySelectorAll('.accent-swatch').forEach(btn => {
        if (btn.getAttribute('data-color') === color) {
          btn.classList.add('ring-white');
        } else {
          btn.classList.remove('ring-white');
        }
      });
      applyAccentToIframe();
    }

    function applyAccentToIframe() {
      try {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        idoc.documentElement.style.setProperty('--accent', currentAccent);
        idoc.documentElement.style.setProperty('--accent-muted', `${currentAccent}26`);
      } catch (e) {
        console.error(e);
      }
    }

    // Initial run
    loadIframeContent();
    setViewportMode('desktop');
    setAccent('#10B981');
  </script>
</body>
</html>
