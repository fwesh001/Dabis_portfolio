  <script>
    lucide.createIcons();

    function setAdminScreen(screen) {
      const screens = ['overview', 'settings', 'projects', 'studio', 'login'];
      screens.forEach(s => {
        const el = document.getElementById(`screen-${s}`);
        const btn = document.getElementById(`screen-btn-${s}`);
        if (s === screen) {
          if (el) el.classList.remove('hidden');
          if (btn) btn.className = 'screen-tab px-2.5 py-1 rounded-md bg-zinc-800 text-white border border-zinc-700 flex items-center gap-1.5';
        } else {
          if (el) el.classList.add('hidden');
          if (btn) btn.className = 'screen-tab px-2.5 py-1 rounded-md text-zinc-400 hover:text-white flex items-center gap-1.5';
        }
      });
      if (screen === 'studio') updateLiveMarkdownPreview();
    }

    // Availability switch in admin
    let adminAvail = true;
    function toggleAdminAvailability() {
      adminAvail = !adminAvail;
      const knob = document.getElementById('admin-avail-knob');
      const btn = document.getElementById('admin-avail-toggle');
      const text = document.getElementById('admin-avail-text');
      if (adminAvail) {
        knob.style.transform = 'translateX(20px)';
        btn.style.backgroundColor = 'var(--accent)';
        text.textContent = 'Available for Work';
        showAdminToast('Availability set to OPEN across public site', 'success');
      } else {
        knob.style.transform = 'translateX(0px)';
        btn.style.backgroundColor = '#3f3f46';
        text.textContent = 'Unavailable';
        showAdminToast('Availability set to BUSY', 'warning');
      }
    }

    // Drag and drop handlers
    function handleDragOver(e) {
      e.preventDefault();
      document.getElementById('dropzone').classList.add('dropzone-dragging');
    }
    function handleDragLeave(e) {
      e.preventDefault();
      document.getElementById('dropzone').classList.remove('dropzone-dragging');
    }
    function handleDrop(e) {
      e.preventDefault();
      document.getElementById('dropzone').classList.remove('dropzone-dragging');
      const file = e.dataTransfer.files[0];
      if (file) simulateUpload(file);
    }
    function simulateUpload(file) {
      showAdminToast(`Uploading ${file.name} to portfolio-assets/resumes/...`, 'info');
      setTimeout(() => {
        showAdminToast(`Replaced old asset with ${file.name} successfully!`, 'success');
      }, 1200);
    }

    // Live Markdown Editor synchronization
    function updateLiveMarkdownPreview() {
      const title = document.getElementById('post-title-input').value;
      const md = document.getElementById('markdown-input').value;
      document.getElementById('preview-title').textContent = title || 'Untitled Article';

      // Simple markdown parser simulation
      let html = md
        .replace(/^## (.*$)/gim, '<h2 class="text-lg font-bold text-white font-mono pt-3 pb-1">$1</h2>')
        .replace(/^### (.*$)/gim, '<h3 class="text-sm font-bold text-zinc-200 font-mono pt-2">$1</h3>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong class="text-white">$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em class="text-zinc-300">$1</em>')
        .replace(/```go([\s\S]*?)```/gim, '<pre class="bg-zinc-900 border border-zinc-800 p-3 rounded-lg font-mono text-[11px] text-emerald-400 overflow-x-auto">$1</pre>')
        .replace(/^- (.*$)/gim, '<li class="list-disc pl-2 ml-4 text-zinc-400">$1</li>');

      document.getElementById('preview-body').innerHTML = html;
    }

    function insertMd(before, after) {
      const textarea = document.getElementById('markdown-input');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      textarea.value = text.substring(0, start) + before + text.substring(start, end) + after + text.substring(end);
      updateLiveMarkdownPreview();
    }

    // Mobile Studio Tab switcher
    function setMobileStudioTab(tab) {
      const editor = document.getElementById('studio-editor-pane');
      const preview = document.getElementById('studio-preview-pane');
      const tabEd = document.getElementById('m-tab-editor');
      const tabPr = document.getElementById('m-tab-preview');

      if (tab === 'preview') {
        editor.classList.add('hidden');
        preview.classList.remove('hidden');
        tabPr.className = 'px-2.5 py-1 rounded bg-zinc-800 text-white';
        tabEd.className = 'px-2.5 py-1 rounded text-zinc-400';
      } else {
        preview.classList.add('hidden');
        editor.classList.remove('hidden');
        tabEd.className = 'px-2.5 py-1 rounded bg-zinc-800 text-white';
        tabPr.className = 'px-2.5 py-1 rounded text-zinc-400';
      }
    }

    function reorderProject(id, dir) {
      showAdminToast(`Project reordered (${dir}) — revalidatePath(/projects) triggered`, 'success');
    }

    function fillDemoCreds() {
      document.getElementById('login-email').value = 'admin@olehidavis.dev';
      document.getElementById('login-pwd').value = 'secure_admin_pass_2026';
      showAdminToast('Demo credentials inserted', 'info');
    }

    function showAdminToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-700/80 shadow-2xl text-xs text-zinc-100 font-sans transition-all duration-300 transform translate-y-4 opacity-0';
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : (type === 'warning' ? 'alert-triangle' : 'info')}" class="w-4 h-4 ${type === 'success' ? 'text-[var(--accent)]' : (type === 'warning' ? 'text-amber-400' : 'text-blue-400')}"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons({ root: toast });
      requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Initial call
    updateLiveMarkdownPreview();
  <\/script>

    }

    function setViewportMode(mode) {
      currentMode = mode;
      
      document.getElementById('btn-desktop').className = mode === 'desktop' 
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';
      
      document.getElementById('btn-mobile').className = mode === 'mobile'
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';

      document.getElementById('btn-fluid').className = mode === 'fluid'
        ? 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-white bg-zinc-800 shadow-sm flex items-center gap-1.5'
        : 'px-2.5 py-1 rounded-md font-mono font-medium transition-all text-zinc-400 hover:text-zinc-100 flex items-center gap-1.5';

      if (mode === 'desktop') {
        container.style.width = '1440px';
        container.style.maxWidth = '100%';
        container.style.height = '100%';
        container.classList.remove('phone-bezel');
        container.classList.add('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.remove('hidden');
        notch.classList.add('hidden');
        viewportIndicator.textContent = '1440 x 900';
      } else if (mode === 'mobile') {
        container.style.width = '390px';
        container.style.maxWidth = '390px';
        container.style.height = '844px';
        container.classList.add('phone-bezel');
        container.classList.remove('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.add('hidden');
        notch.classList.remove('hidden');
        viewportIndicator.textContent = '390 x 844 (iPhone)';
      } else if (mode === 'fluid') {
        container.style.width = '100%';
        container.style.maxWidth = '100%';
        container.style.height = '100%';
        container.classList.remove('phone-bezel');
        container.classList.add('rounded-xl', 'border', 'border-zinc-800');
        desktopChrome.classList.remove('hidden');
        notch.classList.add('hidden');
        viewportIndicator.textContent = `${window.innerWidth} x ${window.innerHeight}`;
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      const root = document.documentElement;
      const themeText = document.getElementById('theme-text');
      const themeIcon = document.getElementById('theme-icon');

      if (currentTheme === 'light') {
        root.classList.remove('dark');
        themeText.textContent = 'Light';
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        root.classList.add('dark');
        themeText.textContent = 'Dark';
        themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
      applyThemeToIframe();
    }

    function applyThemeToIframe() {
      try {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        if (currentTheme === 'light') {
          idoc.documentElement.classList.remove('dark');
          idoc.documentElement.classList.add('light');
        } else {
          idoc.documentElement.classList.add('dark');
          idoc.documentElement.classList.remove('light');
        }
      } catch (e) {
        console.error(e);
      }
    }

    function setAccent(color) {
      currentAccent = color;
      document.documentElement.style.setProperty('--accent', color);
      
      document.querySelectorAll('.accent-swatch').forEach(btn => {
        if (btn.getAttribute('data-color') === color) {
          btn.classList.add('ring-white');
        } else {
          btn.classList.remove('ring-white');
        }
      });
      applyAccentToIframe();
    }

    function applyAccentToIframe() {
      try {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        idoc.documentElement.style.setProperty('--accent', currentAccent);
        idoc.documentElement.style.setProperty('--accent-muted', `${currentAccent}26`);
      } catch (e) {
        console.error(e);
      }
    }

    loadIframeContent();
    setViewportMode('desktop');
    setAccent('#10B981');
  </script>
</body>
</html>
